services:
  - type: web
    name: nevergiveup
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: INVITE_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_GIST_ID
        sync: false
      - key: DB_FILE
        value: /tmp/upword.db
